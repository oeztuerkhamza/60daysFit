<section class="auth-shell">
  <form class="auth-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <p class="auth-card__brand"><span>60</span><span>dayfit</span></p>

    <h1>Tekrar hoş geldin</h1>
    <p class="muted">Kaldığın günden devam et.</p>

    @if (error()) {
      <p class="alert alert--error" role="alert">{{ error() }}</p>
    }

    <div class="field">
      <label for="email">E-posta</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" required />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="field__hint">Geçerli bir e-posta adresi gir.</p>
      }
    </div>

    <div class="field">
      <label for="password">Şifre</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" required />
    </div>

    <div class="field">
      <button class="btn btn--primary btn--block" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Giriş yapılıyor…' : 'Giriş yap' }}
      </button>
    </div>

    <p class="auth-card__switch">Hesabın yok mu? <a routerLink="/kayit">Kayıt ol</a></p>
  </form>
</section>
