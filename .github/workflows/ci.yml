name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint:types

      - name: Unit tests
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Production build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  schema:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Stub the Supabase auth schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/test/auth_stub.sql

      - name: Apply migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "== $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply migrations again (they must be idempotent)
        run: |
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Check the seeded program
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            do \$\$
            declare
              days int; entries int; exercises int;
            begin
              select count(*) into days from public.program_days;
              select count(*) into entries from public.program_day_exercises;
              select count(*) into exercises from public.exercises;
              if days <> 60 then raise exception 'expected 60 program days, found %', days; end if;
              if entries < 300 then raise exception 'expected 300+ day exercises, found %', entries; end if;
              if exercises < 30 then raise exception 'expected 30+ exercises, found %', exercises; end if;
            end \$\$;
          "
