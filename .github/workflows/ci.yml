name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Type check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run lint:types

      - name: Unit tests
        run: npm run test:ci
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Production build
        run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

  schema:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Stub the Supabase auth schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/test/auth_stub.sql

      - name: Apply migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "== $file"
            psql -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Apply migrations again (they must be idempotent)
        run: |
          for file in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done

      - name: Check the seeded program
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            do \$\$
            declare
              days int; strength_rows int; walk_only int; first_km numeric; last_km numeric;
            begin
              select count(*) into days from public.program_days;
              select count(*) into strength_rows from public.program_day_exercises;
              select count(*) into walk_only from public.program_days where day_type = 'walk';
              select walk_distance_km into first_km from public.program_days where day = 1;
              select walk_distance_km into last_km from public.program_days where day = 60;

              if days <> 60 then
                raise exception 'expected 60 program days, found %', days;
              end if;
              -- 46 walk+strength days x (2 phases x 2 exercises)
              if strength_rows <> 184 then
                raise exception 'expected 184 strength rows, found %', strength_rows;
              end if;
              -- Week 1 is walking only: six training days before the first rest day.
              if walk_only <> 6 then
                raise exception 'expected 6 walk-only days, found %', walk_only;
              end if;
              if first_km <> 3.0 then
                raise exception 'expected day 1 at 3.0 km, found %', first_km;
              end if;
              if last_km <= first_km then
                raise exception 'distance must grow: day 1 % vs day 60 %', first_km, last_km;
              end if;
            end \$\$;
          "

      - name: Check row level security is on every user table
        run: |
          psql -v ON_ERROR_STOP=1 -tAc "
            do \$\$
            declare
              unguarded text;
            begin
              select string_agg(tablename, ', ') into unguarded
              from pg_tables
              where schemaname = 'public'
                and tablename in ('profiles','daily_logs','set_logs','checkpoints','checkpoint_photos','meals')
                and not rowsecurity;
              if unguarded is not null then
                raise exception 'row level security is off for: %', unguarded;
              end if;
            end \$\$;
          "
